<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="get" target="_blank" autocomplete="off">

        <p>
            <label for="">Nome</label>
                <input type="text" name="" id="">
        </p>
         <p>
            <label for="">senha</label>
                <input type="password" name="" id="">
        </p>
         <p>
            <label for="">range: </label>
                <input type="range" name="" id="" min="0" max="10" step="2">
                 

        </p>
        <p>
            <label for="">Outro range</label>
            <input type="range" name="" id="" list="test">
                 <datalist id="test">
                    <option value="0" label="0%"></option>
                    <option value="10"></option>
                    <option value="20"></option>
                    <option value="50" label="50%"></option>
                    <option value="70"></option>
                    <option value="100" label="100%"></option>
                 </datalist>
        </p>
        <p>
            <label for=""> Sua url: </label>
            <input type="url" name="" id="" placeholder="URL:">
        </p>
        <p>
            <label for="">search</label>
            <input type="search" name="" id="">
        </p>
        <p>
            <label for=""> Selecione seu estilo</label>
            <select name="" id="">
              
                <option value="pink">Americano</option>
                <option value="" selected>Social</option>
                <option value="">Sexy</option>
                <option value="">Descontraído</option>
            </select>
        </p>

        <p>
            <label for=""> Deixe a sua opinião</label> <br>
            <textarea name="" id=""></textarea>
        </p>
    
    </form>
</body>
</html>
