<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS3 -  2</title>
    <style>
        body{
            margin: 0;
            padding: 0;
        }
        #heading{
            background: red;
        }
        #heading div{
            display: 50%;
            display: flex;
            background: black;
            justify-content: space-between;
            margin: 0 auto;
        }
        #heading .h1 a{
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            padding: 15px;  
            color: white;
        }
        
    </style>
</head>
<body>
    <header id="heading"> 
        <div>
        <h1 class="h1">
             <a href="#">ZABBIX</a>
        </h1>
          <h2 class="h1">
             <a href="#">ZABBIX</a>
        </h2>
        </div>
        
    </header>
      
</body>
</html>
